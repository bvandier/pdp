<!doctype html>
<html lang="nl">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>PDP schrijnwerken</title>
	<meta name="description" content="PDP schrijnwerken – Philippe De Pourcq, schrijnwerker in Dudzele (Brugge).">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@300&display=swap">
	<link rel="stylesheet" href="style.css">
	<noscript><style>body::after { display: none; } .card { transform: none !important; opacity: 0.95 !important; }</style></noscript>
</head>
<body class="is-loading">
	<div id="wrapper">
		<main class="card">
			<img class="logo" src="img/logo.png" width="736" height="361" alt="PDP schrijnwerken">
			<h1>Philippe De Pourcq</h1>
			<address>
				Sint-Lenardsstraat 43<br>
				8380 Dudzele (Brugge)<br>
				<a href="tel:+32494532793">+32(0)494532793</a>
			</address>
			<a class="mail" id="mail" aria-label="E-mail">
				<svg viewBox="0 0 28 22" aria-hidden="true"><rect x="1.5" y="1.5" width="25" height="19" rx="3" /><path d="M2.5 3.5l11.5 9 11.5-9" /></svg>
			</a>
		</main>
		<footer>&copy; <span id="year">2026</span> PDP schrijnwerken. Alle rechten voorbehouden.</footer>
	</div>
	<script>
		// Build the address at runtime so it isn't sitting in the HTML for scrapers.
		var addr = ['philippe', 'schrijnwerken.eu'].join('@');
		var mail = document.getElementById('mail');
		mail.href = 'mailto:' + addr;
		mail.title = addr;
		document.getElementById('year').textContent = new Date().getFullYear();

		window.addEventListener('load', function () {
			document.body.classList.remove('is-loading');
		});
	</script>
</body>
</html>
